name: ios-ipa-build

# Builds an UNSIGNED IPA of Sam-CloudeSpace for personal sideloading (AltStore etc.).
# Manual trigger only: run this once the Xcode project source is added to this repo.
# Before running: set the scheme name below to match the project (default: SamCloudeSpace).
on:
  workflow_dispatch:
    inputs:
      scheme:
        description: Xcode scheme name
        required: true
        default: SamCloudeSpace

jobs:
  build-ipa:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build unsigned archive
        run: |
          xcodebuild -scheme "${{ inputs.scheme }}" -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive

      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/app.xcarchive/Products/Applications/"*.app "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP" && zip -qry Sam-CloudeSpace-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sam-CloudeSpace-unsigned.ipa
          path: ${{ runner.temp }}/Sam-CloudeSpace-unsigned.ipa
          retention-days: 7
